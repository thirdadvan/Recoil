  for(let i=0;i<20;i++) {
    const x=i*3-5, h=3+(i*7%6);rect(x,0,2.3,h,'#1b2a32');
    for(let j=0;j<3;j++)rect(x+.4,1.8+j*1.4,.2,.38,'#35463f');
  }
  rect(16,0,23,6,'#1b272d');
  for(let i=0;i<7;i++) {rect(17+i*3.5,0,.16,6,'#29383e');rect(17+i*3.5,5.35,.65,.1,'#405254');}
  rect(1.1,.1,2.4,.65,'#344a54');rect(1.5,.75,1.3,.5,'#435d65');
  rect(1.35,0,.45,.35,'#111b20');rect(2.85,0,.45,.35,'#111b20');

  rect(18.5,2.2,.2,.2,game.checkpoint?'#8de4be':'#485853');
  ctx.font='12px "PingFang SC", "Microsoft YaHei", sans-serif';ctx.fillStyle='#789491';ctx.fillText('FACTORY / 工厂',sx(16.3),sy(6.85));
  ctx.fillStyle='#85ae9a';ctx.fillText('EXIT',sx(37),sy(3.15));
  if(!game.hasClue){rect(31.3,.53,.4,.55,'#e2c88d');rect(31.36,.83,.26,.035,'#8b7b5b');rect(31.36,.73,.2,.035,'#8b7b5b');}
  for(const b of game.blocks){
    rect(b.x,b.y,b.w,b.h,b.cover?'#526060':'#303f45');rect(b.x,b.y+b.h-.07,b.w,.07,'#778b89');
    if(b.cover){rect(b.x+.15,b.y+.15,b.w-.3,.04,'#2e4245');rect(b.x+b.w/2-.04,b.y,.08,b.h,'#31464a');rect(b.x,b.y+b.h/2,b.w,.06,'#35494b');}
  }
  for(const bag of game.items){
    rect(bag.x-.32,bag.y-.45,.64,.9,bag.completed?'#536361':'#b68b55');
    rect(bag.x-.22,bag.y-.22,.44,.32,'#725739');rect(bag.x-.18,bag.y+.45,.36,.1,'#d8b47c');
    rect(bag.x-.27,bag.y-.3,.055,.7,'#ddbb86');rect(bag.x+.21,bag.y-.3,.055,.7,'#ddbb86');
  }
  for(const e of game.enemies){
    person(e);ctx.font='12px "PingFang SC", "Microsoft YaHei", sans-serif';ctx.fillStyle=e.state==='attack'?'#ff8f77':'#afc7d2';ctx.textAlign='center';ctx.fillText(e.state==='swarm'&&e.disobedienceProgress>.15?(!e.waveMoving?'保持静止！':'遵从方向！'):({roaming:e.watchingPlayer?`注视中 · 怒气 ${Math.round(e.noiseAnger*100)}%`:e.investigate>0?'调查声音':e.patrol&&e.patrol.arrived?({stay:'停留',lookAround:'左右张望',lookLeft:'向左看',lookRight:'向右看'})[e.patrol.current.action]:'巡逻',irritated:e.flightAnger>0?`激怒 · 飞行怒气 ${Math.round(e.flightAnger*100)}%`:'激怒 / 停止违规',attack:e.swarmAttackBoost?'攻击 / 声波强化':'攻击 / 追踪',swarm:e.recovery>0?'恢复漫游':e.waveDelay>0?`准备移动 ${e.waveDelay.toFixed(1)}s`:e.waveMoving?`${e.waveDirection<0?'← 向左':'向右 →'} ${e.waveMove.toFixed(1)}s`:e.waveHold>0?`静止等待 ${e.waveHold.toFixed(1)}s`:'等待下一波'})[e.state],sx(e.x),sy(e.y+1.7));ctx.textAlign='left';if(e.alert>.02){ctx.fillStyle='#443b37';ctx.fillRect(sx(e.x)-23,sy(e.y+1.35),46,4);ctx.fillStyle='#ee997d';ctx.fillRect(sx(e.x)-23,sy(e.y+1.35),46*(e.watchingPlayer?e.noiseAnger:e.state==='irritated'&&e.flightAnger>0?e.flightAnger:e.alert),4);}
    if(e.investigate>0 && e.alert<.2){ctx.fillStyle='#c9b996';ctx.font='18px "PingFang SC", "Microsoft YaHei", sans-serif';ctx.fillText('?',sx(e.x)-4,sy(e.y+1.55));}
  }
  person(game.pos,true);
  ctx.save();ctx.translate(sx(game.pos.x),sy(game.pos.y));ctx.rotate(-Math.atan2(game.aim.y,game.aim.x));ctx.fillStyle='#50ceef';ctx.fillRect(12,-5,28,9);ctx.fillStyle='#2d94ad';ctx.fillRect(18,4,7,9);ctx.fillStyle='#9be9ff';ctx.fillRect(34,-4,8,7);ctx.restore();
  for(const s of game.sprays){ctx.strokeStyle=`rgba(136,231,255,${1-(game.time-s.at)/.16})`;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(sx(s.start.x),sy(s.start.y));ctx.lineTo(sx(s.end.x),sy(s.end.y));ctx.stroke();}
  for(const lamp of game.streetLamps){rect(lamp.x+.44,lamp.y-lamp.coneLength,.12,lamp.coneLength,'#525c64');rect(lamp.x-.4,lamp.y-.08,.8,.16,lamp.isOn?'#ffe4a0':'#384047');}
  renderLighting();
  for(const lamp of game.streetLamps)if(lamp.isOn){ctx.save();ctx.fillStyle='#ffe4a0';ctx.shadowColor='#ffe4a0';ctx.shadowBlur=12;ctx.fillRect(sx(lamp.x)-19,sy(lamp.y)-4,38,8);ctx.restore();}
  // Gameplay warnings stay readable over the darkness within the player's visual light.
  for(const e of game.enemies)if((e.watchingPlayer||(e.state==='irritated'&&e.flightAnger>0))&&Math.hypot(e.x-game.pos.x,e.y-game.pos.y)<game.lighting.playerLightRadius){
    ctx.save();ctx.font='12px "PingFang SC", "Microsoft YaHei", sans-serif';ctx.textAlign='center';ctx.fillStyle='#ffd59a';
    ctx.fillText(e.watchingPlayer?`注视中 · 怒气 ${Math.round(e.noiseAnger*100)}%`:`激怒 · 飞行怒气 ${Math.round(e.flightAnger*100)}%`,sx(e.x),sy(e.y+1.7));
    ctx.fillStyle='#443b37';ctx.fillRect(sx(e.x)-23,sy(e.y+1.35),46,4);ctx.fillStyle='#efa574';ctx.fillRect(sx(e.x)-23,sy(e.y+1.35),46*(e.watchingPlayer?e.noiseAnger:e.flightAnger),4);ctx.restore();
  }
  // Red eyes remain readable in the dark without illuminating the player's surroundings.
  for(const e of game.enemies)if(e.redEyes){
    ctx.save();ctx.fillStyle='#ff3434';ctx.shadowColor='#ff2020';ctx.shadowBlur=12;
    ctx.fillRect(sx(e.x)+(e.facing>0?6:-9),sy(e.y)-1.65*24+8,5,4);ctx.restore();
  }
  renderSoundWaves();
  if(started && !game.dead && !game.won && !paused){
    ctx.strokeStyle='#8dd2dd99';ctx.lineWidth=1;ctx.beginPath();ctx.arc(mouse.x,mouse.y,6,0,Math.PI*2);ctx.stroke();
    ctx.font='16px "PingFang SC", "Microsoft YaHei", sans-serif';ctx.fillStyle='#dfdbc6';ctx.textAlign='center';
    if(game.nearbyStreetLamp)ctx.fillText('E · 关闭路灯（瞬间互动）',sx(game.nearbyStreetLamp.x),sy(game.nearbyStreetLamp.y+.5));
    const bag=game.nearbyItem;
    if(bag){
      ctx.fillText('按住 E · 搜索员工背包（1.5 秒）',sx(bag.x),sy(1.9));
      if(game.activeItem){
        ctx.fillStyle='#101a20';ctx.fillRect(350,488,580,76);
        ctx.fillStyle='#43504e';ctx.fillRect(390,505,500,8);ctx.fillStyle='#e2c88d';ctx.fillRect(390,505,500*bag.progress/bag.duration,8);
        const witnesses=game.enemies.filter(e=>e.state==='irritated'&&e.graceSession===bag.session&&e.canSee());
        const remaining=witnesses.length?Math.max(0,.5-Math.max(...witnesses.map(e=>game.time-e.interactionSeenAt))):null;
        ctx.fillStyle=remaining===null?'#dfdbc6':'#ff987e';
        ctx.fillText(remaining===null?'搜索中 · 松开 E 取消':`被目击！${remaining.toFixed(2)} 秒内松开 E，继续将触发攻击`,640,546);
      }
    }
    if(!game.hasClue && Recoil.distance(game.pos,{x:31.5,y:.8})<1.5)ctx.fillText('E · 查看纸条',sx(31.5),sy(1.9));
    if(game.nearbyDoor)ctx.fillText(game.nearbyDoor.interactionPrompt,sx(game.nearbyDoor.x),sy(game.nearbyDoor.y+2.25));ctx.textAlign='left';
  }
  document.querySelector('#objective').textContent=game.hasClue?'线索已找到。前往绿色出口，按 E 离开。':'进入工厂，寻找失踪者的线索。';
  document.querySelector('#status').textContent=(game.checkpoint?'工厂 / 已设检查点':'室外院子')+(game.inventory.has('employee_access_card')?' · 背包：员工门禁卡':'')+' · '+(game.flying?'悬浮中':game.crouched?'安静蹲行':game.grounded?'地面':'下落中')+` · 生命 ${game.health}/3 · 速度 ${(game.damageSpeedMultiplier*100).toFixed(2)}% · 水枪 ${game.ammo}/3 · 受光 ${Math.round(game.illumination*100)}%`+(game.grounded&&game.ammo<3?' · 补充中':'')+(game.passageSpeedMultiplier<1?' · 穿越减速':'');
  document.querySelector('#bar').hidden=!game.flying;document.querySelector('#fuel').style.width=Recoil.clamp(1-(game.time-game.shotAt),0,1)*100+'%';
  const speech=document.querySelector('#speech');speech.hidden=!started || paused || game.dead || game.won || game.time>game.monologueUntil;speech.textContent='DUN / “'+game.monologue+'”';
}
function frame(now){
  const dt=previous?Math.min((now-previous)/1000,.033):.016;previous=now;
  if(started && !paused){
    const has=k=>keys.has(k);
    game.tick({x:Number(has('KeyD')||has('ArrowRight'))-Number(has('KeyA')||has('ArrowLeft')),
      y:Number(has('KeyW')||has('ArrowUp')||has('Space'))-Number(has('KeyS')||has('ArrowDown')),
      sneak:has('KeyC')||has('ControlLeft'),fire:firing,jump:pressed.has('Space'),launch:pressed.has('KeyW')||pressed.has('ArrowUp'),interact:pressed.has('KeyE'),interactHeld:has('KeyE'),broadcast:pressed.has('KeyB'),
      aim:{x:(mouse.x-640)/48+game.camera-game.pos.x,y:(590-mouse.y)/48-game.pos.y}},dt);
    if(game.dead)menu('dead');else if(game.won)menu('won');
  }
  pressed.clear();render();requestAnimationFrame(frame);
}
menu('start');requestAnimationFrame(frame);
